<style>
  @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap');
  :root{--blue:#b15be8;--blue-d:#8e42bd;--brand-primary:#32217c;--ice:#f3efff;--line:#e8e1f7;--ink:#0f2438;--grey:#5b6b7a;--red:#e0492f;--red-soft:#fdecea;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Manrope',system-ui,sans-serif;color:var(--ink);background:radial-gradient(1100px 560px at 80% -10%,rgba(0,120,199,.10),transparent 60%),#f3f7fb;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 8px 40px rgba(13,42,71,.10);width:100%;max-width:400px;padding:40px 36px;}
  .logo{font-weight:800;font-size:20px;letter-spacing:-.4px;color:var(--brand-primary);text-align:center;}
  .logo .o{color:var(--blue);}
  h1{font-family:'Fraunces',serif;font-weight:600;font-size:24px;color:var(--brand-primary);text-align:center;margin:22px 0 4px;}
  .sub{text-align:center;color:var(--grey);font-size:13.5px;margin-bottom:26px;}
  label{display:block;font-size:12.5px;font-weight:700;color:var(--brand-primary);margin:14px 0 6px;}
  input{width:100%;font-family:inherit;font-size:14px;padding:12px 14px;border:1px solid var(--line);border-radius:11px;background:#fafcfe;transition:.15s;}
  input:focus{outline:none;border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(0,120,199,.12);}
  button{width:100%;margin-top:22px;font-family:inherit;font-weight:700;font-size:14px;color:#fff;background:var(--brand-primary);border:none;border-radius:11px;padding:13px;cursor:pointer;transition:.15s;}
  button:hover{background:var(--blue-d);}
  button:disabled{opacity:.6;cursor:not-allowed;}
  .err{display:none;background:var(--red-soft);color:#b5391f;font-size:13px;font-weight:600;padding:11px 14px;border-radius:11px;margin-top:18px;}
  #cookie-banner{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);box-shadow:0 -8px 30px rgba(13,42,71,.08);padding:16px 20px;display:none;z-index:999;}
  #cookie-banner .inner{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:20px;flex-wrap:wrap;}
  #cookie-banner p{flex:1;min-width:220px;font-size:13px;color:var(--grey);margin:0;line-height:1.5;}
  #cookie-banner a{color:var(--blue-d);font-weight:700;text-decoration:none;}
  #cookie-banner .actions{display:flex;gap:10px;flex-shrink:0;}
  #cookie-banner button{width:auto;margin:0;font-size:13px;padding:10px 18px;border-radius:9px;}
  #cookie-banner .accept{background:var(--brand-primary);color:#fff;border:none;}
  #cookie-banner .accept:hover{background:var(--blue-d);}
  #cookie-banner .dismiss{background:#fff;color:var(--grey);border:1px solid var(--line);}
  /* Dark sign-in stays visibly dark without becoming a near-black blackout.
     These surfaces are deliberately lighter than dashboard chrome and keep the
     original empower-fin purple as the brand cue. Partner links still tint the
     page through --brand-primary/--blue without changing the default palette. */
  html[data-theme="dark"]{
    filter:none !important;
    --auth-dark-shell:#141226;
    --auth-dark-surface:#1E1B33;
    --auth-dark-input:#17152A;
    --auth-dark-line:#3D3856;
    --auth-dark-muted:#BEB8CF;
    --white:var(--auth-dark-surface);
    --ink:#fbf9fc;
    --grey:var(--auth-dark-muted);
    --line:var(--auth-dark-line);
    --line-soft:#5e5667;
    background:var(--auth-dark-shell) !important;
    color:#fbf9fc;
  }
  html[data-theme="dark"] body{
    background:
      radial-gradient(900px 520px at 78% -8%,color-mix(in srgb,var(--blue) 10%,transparent),transparent 62%),
      linear-gradient(160deg,#1A1730 0%,var(--auth-dark-shell) 100%);
    color:#fbf9fc;
  }
  html[data-theme="dark"] h1,html[data-theme="dark"] label,html[data-theme="dark"] .logo{color:#fbf9fc;}
  html[data-theme="dark"] .sub,html[data-theme="dark"] label[style],html[data-theme="dark"] #cookie-banner p{color:var(--auth-dark-muted);}
  html[data-theme="dark"] #cookie-banner{background:var(--auth-dark-surface);border-color:var(--auth-dark-line);}
  html[data-theme="dark"] #cookie-banner .dismiss{background:#19162a;color:#eee9f1;border-color:var(--auth-dark-line);}
  html[data-theme="dark"] #forgot-link,html[data-theme="dark"] .card a{color:#5FE0C0 !important;}
  html[data-theme="dark"] .card{background:var(--auth-dark-surface)!important;border-color:var(--auth-dark-line)!important;box-shadow:0 18px 55px rgba(0,0,0,.22)!important;}
  html[data-theme="dark"] input{background:var(--auth-dark-input)!important;border-color:var(--auth-dark-line)!important;color:#f7f5fb!important;}
  html[data-theme="dark"] input:focus{border-color:#0FC79B!important;box-shadow:0 0 0 3px rgba(15,199,155,.12)!important;}
  html[data-theme="dark"] button{background:#2B1D73!important;}
  html[data-theme="dark"] button:hover{background:#38258F!important;}
</style>
