  :root{
    --blue:#7d2fa3;--blue-d:#682487;--brand-primary:#2b1b68;--ice:#eee8fb;--ice-2:#edf4fa;
    --line:#d7cde9;--line-soft:#e8e3f1;--ink:#0f2438;--grey:#425466;--grey-l:#617486;
    --green:#187a4d;--green-soft:#dff3e8;--amber:#9a5b00;--amber-soft:#fcedd4;
    --red:#b5391f;--red-soft:#fbe4df;--white:#fff;--brand-soft:#eee8fb;
    --chart-engagement:#3a93d2;--chart-cashflow:#1fa463;--chart-debt:#607486;
    --chart-insurance:#8a4fc4;--chart-workforce:#4ea3da;--chart-low:#1fa463;
    --chart-mid:#e8910c;--chart-high:#e0492f;
    --shadow:0 1px 2px rgba(13,42,71,.04),0 8px 24px rgba(13,42,71,.06);
    --radius:16px;--radius-sm:11px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Manrope',system-ui,sans-serif;color:var(--ink);
    background:#f3f7fb;min-height:100vh;}
  .wrap{max-width:1100px;margin:0 auto;padding:0 32px 96px;}
  .topbar{position:sticky;top:0;z-index:40;background:rgba(243,247,251,.86);border-bottom:1px solid var(--line);}
  .topbar-inner{max-width:1100px;margin:0 auto;padding:0 32px;height:68px;display:flex;align-items:center;gap:14px;}
  .logo-text{font-weight:800;font-size:16px;letter-spacing:-.3px;color:var(--brand-primary);}
  .logo-text .opt{color:var(--blue);}
  .pill{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);background:var(--ice);border:1px solid var(--line);padding:5px 11px;border-radius:8px;}
  .head{padding:44px 0 28px;}
  .head .eyebrow{font-size:12px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--blue);margin-bottom:11px;}
  .head h1{font-family:'Fraunces',serif;font-weight:600;font-size:36px;letter-spacing:-.6px;color:var(--brand-primary);}
  .head p{margin-top:12px;font-size:14.5px;color:var(--grey);max-width:64ch;line-height:1.6;}
  .grid{display:grid;grid-template-columns:300px 1fr;gap:26px;align-items:start;}
  .card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);}
  .card-hd{padding:22px 24px 14px;border-bottom:1px solid var(--line-soft);}
  .card-hd h2{font-size:14.5px;font-weight:800;color:var(--brand-primary);letter-spacing:.01em;}
  .card-hd .note{font-size:12px;color:var(--grey-l);margin-top:5px;line-height:1.5;}
  .card-bd{padding:22px 24px 26px;}
  .card-bd>*+*{margin-top:16px;} /* consistent vertical rhythm between fields/sections; .section-gap (below) still wins for explicit section breaks since it's more specific */
  /* report list */
  .rep{display:flex;flex-direction:column;gap:2px;padding:11px 13px;border-radius:var(--radius-sm);cursor:pointer;border:1px solid transparent;transition:.14s;}
  .rep:hover{background:var(--ice-2);}
  .rep.on{background:var(--ice);border-color:var(--line);}
  .rep .step{font-size:10.5px;font-weight:800;color:var(--grey-l);letter-spacing:.05em;}
  .rep .t{font-size:13.5px;font-weight:700;color:var(--ink);}
  .btn{font-family:inherit;font-weight:700;font-size:13px;border-radius:11px;padding:10px 16px;cursor:pointer;border:1px solid var(--line);background:var(--white);color:var(--brand-primary);transition:.14s;display:inline-flex;align-items:center;gap:8px;}
  .btn:hover{border-color:var(--blue);color:var(--blue);}
  .btn-primary{background:var(--brand-primary);color:#fff;border-color:var(--brand-primary);}
  .btn-primary:hover{background:var(--blue-d);color:#fff;}
  .btn-green{background:var(--green);color:#fff;border-color:var(--green);}
  .btn-ghost{background:none;box-shadow:none;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
  .muted{color:var(--grey);font-size:13px;line-height:1.55;}
  .drop{margin-top:14px;border:2px dashed var(--line);border-radius:var(--radius);padding:30px;text-align:center;transition:.16s;cursor:pointer;background:var(--ice-2);}
  .drop.over{border-color:var(--blue);background:var(--ice);}
  .drop .big{font-size:14px;font-weight:700;color:var(--brand-primary);}
  .drop .sm{font-size:12.5px;color:var(--grey-l);margin-top:5px;}
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line-soft);}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--grey-l);font-weight:800;}
  .tag{font-size:11px;font-weight:800;padding:3px 8px;border-radius:6px;display:inline-block;}
  .tag.req{background:var(--amber-soft);color:var(--amber);}
  .tag.opt{background:var(--ice);color:var(--grey);}
  .banner{border-radius:var(--radius-sm);padding:13px 15px;font-size:13px;font-weight:600;margin-top:14px;display:flex;gap:9px;align-items:flex-start;}
  .banner.ok{background:var(--green-soft);color:#137a47;}
  .banner.err{background:var(--red-soft);color:#b5391f;}
  .err-list{margin-top:12px;max-height:230px;overflow:auto;border:1px solid var(--line);border-radius:var(--radius-sm);}
  .err-list td:first-child{font-weight:800;color:var(--red);white-space:nowrap;}
  .hist td .st{font-size:11px;font-weight:800;padding:3px 9px;border-radius:6px;}
  .st.COMMITTED{background:var(--green-soft);color:#137a47;}
  .st.VALIDATED{background:var(--ice);color:var(--blue-d);}
  .st.COMMITTING{background:var(--amber-soft);color:#8a5a10;}
  .st.FAILED{background:var(--red-soft);color:#b5391f;}
  .history-row-detail{display:block;margin-top:4px;font-size:10.5px;line-height:1.4;color:var(--grey);font-weight:600;}
  .history-row-detail.live{color:#8a5a10;}
  .job-progress-detail{margin-top:9px;font-size:11.5px;line-height:1.5;color:var(--grey);font-weight:600;}
  .st.REVERTED{background:#f1f1f4;color:#777;}
  .section-gap{margin-top:22px;}
  .field-desc{color:var(--grey-l);}
  code{background:var(--ice);padding:1px 6px;border-radius:5px;font-size:12px;}
  .hidden{display:none;}
  .partner-preview{display:flex;align-items:center;gap:12px;margin-top:12px;padding:12px 14px;border:1px solid var(--preview-line,var(--line));border-radius:12px;background:var(--preview-surface,var(--brand-primary));color:var(--preview-text,#fff);}
  .partner-preview-logo{width:52px;height:52px;border-radius:12px;object-fit:contain;background:var(--preview-logo-bg,#fff);border:1px solid var(--preview-line,var(--line));padding:5px;flex:0 0 auto;}
  .partner-preview-fallback{display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:var(--preview-on-accent,#fff);padding:0;background:var(--preview-accent)!important;}
  .partner-preview-copy{min-width:0;}
  .partner-preview-copy strong{display:block;font-size:14px;color:var(--preview-text,#fff);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .partner-preview-copy span{display:block;margin-top:3px;font-size:11.5px;color:var(--preview-muted,#d7dee5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .partner-preview-badge{margin-left:auto;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--preview-accent,#fff);white-space:nowrap;}
  .partner-preview-open{margin-top:12px;width:100%;justify-content:center;background:var(--brand-primary);color:#fff;border-color:transparent;}
  .partner-preview-open:hover{color:#fff;border-color:transparent;box-shadow:0 10px 24px rgba(50,33,124,.2);}
  .partner-card{animation:partner-card-in .45s both;}
  .partner-card:nth-child(2){animation-delay:.05s}.partner-card:nth-child(3){animation-delay:.1s}.partner-card:nth-child(4){animation-delay:.15s}
  @keyframes partner-card-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .client-preview-overlay{position:fixed;inset:0;z-index:200;background:rgba(15,36,56,.48);display:flex;align-items:center;justify-content:center;padding:18px;opacity:0;visibility:hidden;transition:opacity .25s ease,visibility .25s ease;}
  .client-preview-overlay.is-open{opacity:1;visibility:visible;}
  .client-preview-dialog{width:min(1080px,100%);max-height:min(820px,calc(100vh - 36px));overflow:auto;background:#f4f7fb;border:1px solid rgba(255,255,255,.7);border-radius:22px;box-shadow:0 28px 90px rgba(15,36,56,.3);transform:translateY(14px) scale(.985);transition:transform .3s cubic-bezier(.2,.8,.2,1);}
  .client-preview-overlay.is-open .client-preview-dialog{transform:translateY(0) scale(1);}
  .client-preview-toolbar{display:flex;align-items:center;gap:12px;padding:14px 18px;background:rgba(255,255,255,.88);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2;}
  .client-preview-toolbar strong{font-size:13px;color:var(--brand-primary);flex:1;}
  .client-preview-toolbar span{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--blue-d);background:var(--ice);padding:6px 9px;border-radius:7px;}
  .client-preview-close{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--grey);font-size:20px;line-height:1;cursor:pointer;}
  .client-preview-app{--preview-bg:#f6f4fb;--preview-surface:#fff;--preview-surface-2:#f3efff;--preview-logo-bg:#fff;--preview-navy:#32217c;--preview-blue:#b15be8;--preview-line:#e8e1f7;--preview-ink:#0f2438;--preview-muted:#5b6b7a;--preview-on-accent:#fff;background:var(--preview-bg);color:var(--preview-ink);font-family:Manrope,system-ui,sans-serif;}
  .client-preview-app .cp-topbar{display:flex;align-items:center;gap:12px;padding:16px 28px;background:var(--preview-surface);border-bottom:1px solid var(--preview-line);}
  .client-preview-app .cp-logo{width:34px;height:34px;border-radius:9px;object-fit:contain;background:var(--preview-logo-bg,#fff);border:1px solid var(--preview-line);padding:3px;}
  .client-preview-app .cp-brand{font-weight:800;color:var(--preview-navy);font-size:14px;}
  .client-preview-app .cp-user{margin-left:auto;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--preview-blue);color:var(--preview-on-accent);font-size:11px;font-weight:800;}
  .client-preview-app .cp-body{padding:30px 28px 38px;}
  .client-preview-app .cp-eyebrow{font-size:10px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--preview-blue);}
  .client-preview-app h3{margin-top:7px;font:600 29px Fraunces,serif;color:var(--preview-navy);letter-spacing:-.4px;}
  .client-preview-app .cp-sub{margin-top:7px;font-size:12.5px;color:var(--preview-muted);max-width:620px;line-height:1.5;}
  .client-preview-app .cp-filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px;}
  .client-preview-app .cp-filter{padding:7px 10px;border:1px solid var(--preview-line);border-radius:8px;background:var(--preview-surface);color:var(--preview-muted);font-size:11px;font-weight:700;}
  .client-preview-app .cp-filter.active{background:var(--preview-surface-2);color:var(--preview-navy);border-color:var(--preview-blue);}
  .client-preview-app .cp-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:14px;margin-top:18px;}
  .client-preview-app .cp-card{background:var(--preview-surface);border:1px solid var(--preview-line);border-radius:14px;padding:17px;box-shadow:0 7px 20px rgba(15,36,56,.05);}
  .client-preview-app .cp-card-wide{grid-column:span 2;}
  .client-preview-app .cp-card-label{font-size:11px;font-weight:800;color:var(--preview-muted);text-transform:uppercase;letter-spacing:.05em;}
  .client-preview-app .cp-score{display:flex;align-items:end;gap:10px;margin-top:13px;}
  .client-preview-app .cp-score strong{font-size:42px;line-height:1;color:var(--preview-navy);}
  .client-preview-app .cp-score span{font-size:11px;color:var(--preview-blue);font-weight:800;padding-bottom:5px;}
  .client-preview-app .cp-bars{height:82px;display:flex;align-items:end;gap:7px;margin-top:16px;padding-bottom:3px;border-bottom:1px solid var(--preview-line);}
  .client-preview-app .cp-bars i{display:block;flex:1;border-radius:5px 5px 2px 2px;background:var(--preview-blue);animation:cpBarIn .65s cubic-bezier(.2,.8,.2,1) both;transform-origin:bottom;}
  @keyframes cpBarIn{from{transform:scaleY(0);opacity:.2}to{transform:scaleY(1);opacity:1}}
  .client-preview-app .cp-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:15px;}
  .client-preview-app .cp-kpi{padding:11px;border-radius:10px;background:var(--preview-surface-2);}
  .client-preview-app .cp-kpi strong{display:block;font-size:20px;color:var(--preview-navy);}
  .client-preview-app .cp-kpi span{display:block;margin-top:3px;font-size:10px;color:var(--preview-muted);font-weight:700;}
  .client-preview-app .cp-outcome{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--preview-line);font-size:12px;font-weight:700;color:var(--preview-navy);}
  .client-preview-app .cp-outcome:last-child{border-bottom:0;}
  .client-preview-app .cp-dot{width:9px;height:9px;border-radius:50%;background:var(--preview-blue);}
  @media(max-width:700px){.client-preview-app .cp-grid{grid-template-columns:1fr}.client-preview-app .cp-card-wide{grid-column:span 1}.client-preview-app .cp-body{padding:24px 16px 30px}.client-preview-app .cp-topbar{padding:13px 16px}.client-preview-app h3{font-size:25px}.client-preview-toolbar span{display:none}}
  @media(max-width:760px){.wrap{padding-left:16px;padding-right:16px}.grid{grid-template-columns:1fr}.topbar-inner{padding-left:16px;padding-right:16px}.head h1{font-size:29px}.partner-preview-badge{display:none}}

  /* REAL DASHBOARD SNAPSHOT PREVIEW — mirrors the employer dashboard structure with synthetic data */
  .client-preview-dialog{width:min(1380px,calc(100vw - 36px));max-height:calc(100vh - 36px);}
  .client-preview-app{background:var(--preview-bg);color:var(--preview-ink);}
  .client-preview-app .snap-shell{min-height:100%;background:var(--preview-bg);}
  .client-preview-app .snap-topbar{display:flex;align-items:center;gap:12px;padding:12px 22px;background:var(--preview-navy);color:#fff;border-bottom:2px solid var(--preview-accent);}
  .client-preview-app .snap-partner-logo{max-width:90px;max-height:30px;object-fit:contain;background:transparent;border:0;padding:0;}
  .client-preview-app .snap-partner-fallback{font-size:13px;font-weight:900;letter-spacing:.03em;}
  .client-preview-app .snap-spacer{flex:1;}
  .client-preview-app .snap-nav{display:flex;gap:14px;font-size:9px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;opacity:.82;}
  .client-preview-app .snap-avatar{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--preview-accent);color:var(--preview-on-accent);font-size:9px;font-weight:900;}
  .client-preview-app .snap-body{padding:26px 24px 34px;}
  .client-preview-app .snap-eyebrow{font-size:9px;font-weight:900;letter-spacing:.13em;text-transform:uppercase;color:var(--preview-blue);}
  .client-preview-app .snap-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-end;}
  .client-preview-app .snap-head h3{margin:6px 0 0;font:600 28px Fraunces,serif;color:var(--preview-navy);}
  .client-preview-app .snap-sub{margin-top:5px;color:var(--preview-muted);font-size:11px;max-width:680px;line-height:1.45;}
  .client-preview-app .snap-actions{display:flex;gap:8px;}
  .client-preview-app .snap-btn{padding:8px 11px;border:1px solid var(--preview-line);background:var(--preview-surface);color:var(--preview-navy);border-radius:7px;font-size:9px;font-weight:800;}
  .client-preview-app .snap-btn.primary{background:var(--preview-blue);border-color:var(--preview-blue);color:var(--preview-on-accent);}
  .client-preview-app .snap-period{display:flex;gap:15px;flex-wrap:wrap;margin-top:18px;padding:11px 13px;border-radius:9px;background:var(--preview-surface-2);font-size:9px;font-weight:750;color:var(--preview-navy);}
  .client-preview-app .snap-banner{margin-top:12px;padding:10px 12px;border-radius:8px;background:#fff8e8;border:1px solid #efd49b;color:#7a5512;font-size:9px;line-height:1.4;}
  .client-preview-app .snap-filterbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:12px;padding:8px;border:1px solid var(--preview-line);border-radius:9px;background:var(--preview-surface);}
  .client-preview-app .snap-chip{padding:7px 9px;border-radius:6px;background:var(--preview-surface-2);border:1px solid var(--preview-line);font-size:9px;font-weight:800;color:var(--preview-navy);}
  .client-preview-app .snap-chip.partner{background:var(--preview-navy);border-color:var(--preview-navy);color:#fff;min-width:130px;}
  .client-preview-app .snap-insight{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin-top:10px;}
  .client-preview-app .snap-insight-copy{padding:11px 12px;border:1px solid var(--preview-line);border-radius:9px;background:var(--preview-surface);font-size:9px;line-height:1.45;color:var(--preview-navy);}
  .client-preview-app .snap-impact{margin-top:12px;padding:14px;border-radius:12px;background:linear-gradient(120deg,var(--preview-navy),color-mix(in srgb,var(--preview-navy) 76%,var(--preview-blue)));color:#fff;}
  .client-preview-app .snap-impact-head{display:flex;justify-content:space-between;gap:12px;align-items:center;}
  .client-preview-app .snap-impact h4{margin:0;font:600 16px Fraunces,serif;}
  .client-preview-app .snap-impact-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:0;margin-top:13px;border-top:1px solid rgba(255,255,255,.14);}
  .client-preview-app .snap-impact-cell{padding:12px 10px;border-right:1px solid rgba(255,255,255,.12);}
  .client-preview-app .snap-impact-cell:last-child{border-right:0;}
  .client-preview-app .snap-impact-cell strong{display:block;font:600 18px Fraunces,serif;}
  .client-preview-app .snap-impact-cell span{display:block;margin-top:3px;font-size:8px;opacity:.76;font-weight:700;}
  .client-preview-app .snap-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:12px;margin-top:12px;}
  .client-preview-app .snap-card{background:var(--preview-surface);border:1px solid var(--preview-line);border-radius:11px;padding:13px;}
  .client-preview-app .snap-card-title{font-size:9px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;color:var(--preview-muted);}
  .client-preview-app .snap-wellness{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:center;margin-top:12px;}
  .client-preview-app .snap-score-ring{width:122px;height:122px;border-radius:50%;display:grid;place-items:center;margin:auto;background:conic-gradient(var(--preview-blue) 0 34%,var(--preview-surface-2) 34% 100%);position:relative;}
  .client-preview-app .snap-score-ring:after{content:"";position:absolute;inset:12px;border-radius:50%;background:var(--preview-surface);}
  .client-preview-app .snap-score-ring strong{position:relative;z-index:1;font:600 31px Fraunces,serif;color:var(--preview-navy);}
  .client-preview-app .snap-drivers{display:grid;gap:9px;}
  .client-preview-app .snap-driver{display:grid;grid-template-columns:120px 1fr 32px;gap:8px;align-items:center;font-size:8.5px;color:var(--preview-navy);}
  .client-preview-app .snap-track{height:7px;border-radius:999px;background:var(--preview-surface-2);overflow:hidden;}
  .client-preview-app .snap-fill{height:100%;border-radius:999px;background:var(--preview-blue);}
